name: Build ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # assinatura keyless com cosign (Sigstore)

defaults:
  run:
    # pipefail: se o "lb build" falhar, o passo falha (o "| tee" não esconde mais o erro)
    shell: bash -eo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependências
        run: |
          apt-get update
          apt-get install -y live-build xorriso curl ca-certificates qemu-system-x86 make python3

      - name: Preparar arte, Central e tema de boot
        run: |
          chmod +x auto/* config/hooks/live/*.hook.chroot scripts/*.sh packaging/bin/*
          make prepare

      - name: Build da ISO (live-build)
        run: |
          lb config
          lb build 2>&1 | tee build.log
          ls -lh sururu-isaac-*.hybrid.iso

      - name: Conferir o tamanho da ISO (o GitHub aceita até 2 GB por arquivo)
        run: |
          TAM=$(stat -c %s sururu-isaac-*.hybrid.iso)
          echo "Tamanho da ISO: $((TAM / 1024 / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TAM" -ge 2147483648 ]; then
            echo "::error::A ISO tem $((TAM / 1024 / 1024)) MB e passou do limite de 2048 MB do GitHub. Tire pacotes das listas em config/package-lists."
            exit 1
          fi

      - name: Guardar o log do build (para investigar erros)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # O GitHub roda o QEMU sem KVM (emulando o processador), então o boot é
      # lento. O teste avisa, mas não impede a versão alfa de ser publicada.
      - name: Teste de boot no QEMU
        id: boot
        continue-on-error: true
        timeout-minutes: 30
        run: HEADLESS=1 BOOT_TIMEOUT=1500 ./scripts/test-qemu.sh

      - name: Guardar o log do boot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boot-log
          path: boot.log
          if-no-files-found: ignore

      - name: Checksum
        run: sha256sum sururu-isaac-*.hybrid.iso > SHA256SUMS

      - name: SBOM (Syft) e varredura (Trivy)
        # Versões fixas: o instalador vem de um commit exato (não da branch main)
        # e confere o checksum do binário antes de instalar.
        env:
          SYFT_VERSION: v1.55.0
          SYFT_COMMIT: f15c3343e29dfb20cf6d82c820e7090b49808c96
          TRIVY_VERSION: v0.76.1
          TRIVY_COMMIT: e713f67f7d54decdcd9b3132c9751833dcced698
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_COMMIT}/install.sh" | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft dir:chroot -o spdx-json > sbom.spdx.json
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_COMMIT}/contrib/install.sh" | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy rootfs --severity HIGH,CRITICAL --exit-code 0 chroot | tee trivy.txt

      - name: Instalar cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Assinar com cosign
        run: cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.sigstore.json

      - name: Notas da versão
        run: |
          {
            echo "## Sururu Linux ${GITHUB_REF_NAME}"
            echo
            echo "Versão de teste (alfa). Baseada no Debian 13."
            echo
            echo "**Teste de boot automático:** ${{ steps.boot.outcome == 'success' && 'passou ✅' || 'não concluiu no tempo do CI (sem KVM) ⚠️' }}"
            echo
            echo "### Como usar"
            echo "1. Baixe a ISO e o SHA256SUMS e confira: \`sha256sum -c SHA256SUMS --ignore-missing\`"
            echo "2. Grave no pendrive (Rufus no modo DD, balenaEtcher ou Ventoy)"
            echo "3. Dê boot. Guia completo: https://sururu.kurumintecnologia.com.br/docs/comecar/"
          } > NOTAS.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Enquanto só existem versões de teste, cada uma vira a "latest":
          # assim o botão do site (releases/latest/download/...) sempre baixa a mais nova.
          prerelease: false
          make_latest: true
          body_path: NOTAS.md
          files: |
            sururu-isaac-*.hybrid.iso
            SHA256SUMS
            SHA256SUMS.sigstore.json
            sbom.spdx.json
            trivy.txt

name: Central e laboratórios

on:
  pull_request:
    paths: ["central/**"]
  push:
    branches: [main]
    paths: ["central/**"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Python compila
        run: python3 -m py_compile central/sururu_central.py
      - name: Laboratórios têm os campos obrigatórios
        run: python3 scripts/validar-labs.py

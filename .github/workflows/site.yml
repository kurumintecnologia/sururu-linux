name: Site e documentação

# Publica em https://sururu.kurumintecnologia.com.br
#   /       -> pagina/ (apresentação)
#   /docs/  -> docs/ (MkDocs)
# No GitHub: Settings > Pages > Source: GitHub Actions
on:
  push:
    branches: [main, master]
    paths: ["pagina/**", "docs/**", "mkdocs.yml", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install mkdocs-material
      - name: Monta o site
        run: |
          mkdir -p publico
          cp -r pagina/* publico/
          mkdocs build --strict -d publico/docs
          echo "sururu.kurumintecnologia.com.br" > publico/CNAME
      - uses: actions/upload-pages-artifact@v3
        with: { path: publico }
  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

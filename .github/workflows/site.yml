name: Site e documentação

# Publica em https://sururu.kurumintecnologia.com.br
#   /       -> pagina/ (apresentação)
#   /docs/  -> docs/ (MkDocs)
# No GitHub: Settings > Pages > Source: GitHub Actions
on:
  push:
    branches: [main, master]
    paths: ["pagina/**", "docs/**", "mkdocs.yml", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install mkdocs-material
      - name: Monta o site
        run: |
          mkdir -p publico
          cp -r pagina/* publico/
          mkdocs build --strict -d publico/docs
          echo "sururu.kurumintecnologia.com.br" > publico/CNAME
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: publico }
  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
# Tela de login do Sururu Linux
[greeter]
background=/usr/share/sururu/wallpaper/sururu-lagoa-noite.png
theme-name=Greybird
icon-theme-name=Papirus
font-name=IBM Plex Sans 11
default-user-image=/usr/share/sururu/boot/sururu-avatar.png
indicators=~host;~spacer;~clock;~spacer;~language;~session;~a11y;~power
clock-format=%A, %d de %B  %H:%M
